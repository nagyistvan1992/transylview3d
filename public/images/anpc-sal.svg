<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 50" width="250" height="50">
  <defs>
    <linearGradient id="salGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#12151a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d32f2f"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="1" y="1" width="248" height="48" rx="8" fill="url(#salGrad)" stroke="#384152" stroke-width="1.2"/>
  
  <!-- Left Shield Graphic -->
  <g transform="translate(8, 7)">
    <!-- Red Shield Background -->
    <path d="M18 2 L32 7 C32 24 18 32 18 34 C18 32 4 24 4 7 Z" fill="url(#shieldGrad)" stroke="#ffc107" stroke-width="1.2"/>
    <!-- Romanian Eagle / Scale inside shield -->
    <path d="M18 10 L22 17 L14 17 Z" fill="#ffd700"/>
    <rect x="17" y="15" width="2" height="10" fill="#ffd700"/>
    <circle cx="18" cy="27" r="1.5" fill="#ffffff"/>
    <path d="M12 17 L24 17" stroke="#ffffff" stroke-width="1"/>
    <path d="M12 17 L10 22 L14 22 Z" fill="#ffd700"/>
    <path d="M24 17 L22 22 L26 22 Z" fill="#ffd700"/>
  </g>

  <!-- Text Hierarchy -->
  <text x="50" y="15" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.4">
    AUTORITATEA NAȚIONALĂ
  </text>
  <text x="50" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="600" letter-spacing="0.2">
    PENTRU PROTECȚIA CONSUMATORILOR
  </text>
  
  <rect x="50" y="28" width="190" height="16" rx="3" fill="#8b0000" fill-opacity="0.3" stroke="#d32f2f" stroke-width="0.8"/>
  <text x="56" y="39.5" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.5">
    SAL <tspan fill="#ffc107" font-weight="600" font-size="7.5">— Soluționarea Alternativă</tspan>
  </text>
</svg>
