<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 50" width="250" height="50">
  <defs>
    <linearGradient id="solGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#12151a"/>
    </linearGradient>
    <linearGradient id="euBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0052b4"/>
      <stop offset="100%" stop-color="#002b7f"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="1" y="1" width="248" height="48" rx="8" fill="url(#solGrad)" stroke="#384152" stroke-width="1.2"/>
  
  <!-- Left EU Flag Graphic -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="34" height="34" rx="6" fill="url(#euBlue)" stroke="#ffd700" stroke-width="1"/>
    <!-- 12 Gold Stars Circle -->
    <g transform="translate(17, 17)" fill="#ffd700">
      <circle cx="0" cy="-11" r="1.3"/>
      <circle cx="5.5" cy="-9.5" r="1.3"/>
      <circle cx="9.5" cy="-5.5" r="1.3"/>
      <circle cx="11" cy="0" r="1.3"/>
      <circle cx="9.5" cy="5.5" r="1.3"/>
      <circle cx="5.5" cy="9.5" r="1.3"/>
      <circle cx="0" cy="11" r="1.3"/>
      <circle cx="-5.5" cy="9.5" r="1.3"/>
      <circle cx="-9.5" cy="5.5" r="1.3"/>
      <circle cx="-11" cy="0" r="1.3"/>
      <circle cx="-9.5" cy="-5.5" r="1.3"/>
      <circle cx="-5.5" cy="-9.5" r="1.3"/>
    </g>
  </g>

  <!-- Text Hierarchy -->
  <text x="52" y="15" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.4">
    COMISIA EUROPEANĂ
  </text>
  <text x="52" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="600" letter-spacing="0.2">
    ONLINE DISPUTE RESOLUTION
  </text>
  
  <rect x="52" y="28" width="188" height="16" rx="3" fill="#002b7f" fill-opacity="0.4" stroke="#0052b4" stroke-width="0.8"/>
  <text x="58" y="39.5" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.5">
    SOL <tspan fill="#60a5fa" font-weight="600" font-size="7.5">— Soluționarea Online Litigii</tspan>
  </text>
</svg>
